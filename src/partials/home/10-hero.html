<section id="inicio" class="hero" aria-labelledby="hero-title">
  <div class="hero__stage">
    <div class="hero__side hero__side--l">
      <picture>
        <source type="image/webp" srcset="assets/img/ryz-lado-esq-540.webp 540w, assets/img/ryz-lado-esq-1080.webp 1080w" sizes="(max-width: 760px) 1px, 30vw">
        <img src="assets/img/ryz-lado-esq-540.jpg" srcset="assets/img/ryz-lado-esq-540.jpg 540w, assets/img/ryz-lado-esq-1080.jpg 1080w" sizes="(max-width: 760px) 1px, 30vw"
          width="1080" height="1680" alt="Personagem da RYZ de bandana roxa contando dinheiro na rua à noite" loading="lazy" decoding="async">
      </picture>
    </div>
    <div class="hero__art">
      <picture>
        <source type="image/webp"
          srcset="assets/img/ryz-centro-640.webp 640w, assets/img/ryz-centro-1024.webp 1024w, assets/img/ryz-centro-1440.webp 1440w, assets/img/ryz-centro-1920.webp 1920w"
          sizes="(max-width: 760px) 120vw, 1440px">
        <img src="assets/img/ryz-centro-1440.jpg"
          srcset="assets/img/ryz-centro-640.jpg 640w, assets/img/ryz-centro-1024.jpg 1024w, assets/img/ryz-centro-1440.jpg 1440w, assets/img/ryz-centro-1920.jpg 1920w"
          sizes="(max-width: 760px) 120vw, 1440px"
          width="1440" height="810" alt="Logo da RYZ com coroa, em neon roxo e rosa, sobre uma avenida da cidade à noite" fetchpriority="high" decoding="async">
      </picture>
    </div>
    <div class="hero__side hero__side--r">
      <picture>
        <source type="image/webp" srcset="assets/img/ryz-lado-dir-540.webp 540w, assets/img/ryz-lado-dir-1080.webp 1080w" sizes="(max-width: 760px) 1px, 30vw">
        <img src="assets/img/ryz-lado-dir-540.jpg" srcset="assets/img/ryz-lado-dir-540.jpg 540w, assets/img/ryz-lado-dir-1080.jpg 1080w" sizes="(max-width: 760px) 1px, 30vw"
          width="1080" height="1680" alt="Personagem da RYZ de jaqueta roxa olhando para trás na avenida neon" loading="lazy" decoding="async">
      </picture>
    </div>
  </div>

  <div class="hero__copy">
    <h1 id="hero-title" class="hero__title">
      <span class="hero__title-a">Aqui a cidade</span>
      <span class="hero__title-b">cresce com você</span>
    </h1>
    <p class="hero__sub g-sub" lang="en">The city rises with you</p>
    <div class="hero__cta">
      <div class="hero__hud">
        <span class="g-chip-time hero__players"><svg class="ico" aria-hidden="true"><use href="#i-live"/></svg>Online <b data-players aria-live="polite">--/100</b></span>
        <span class="g-chip-time hero__chip"><svg class="ico" aria-hidden="true"><use href="#i-clock"/></svg>Faça sua WL agora</span>
      </div>
      <a class="g-btn g-btn--primary hero__btn" href="https://discord.gg/jogueryz" data-discord target="_blank" rel="noopener">
        <svg class="ico hero__btn-ico" aria-hidden="true"><use href="#i-discord"/></svg>
        <span class="g-btn__label">Entrar no Discord</span>
      </a>
    </div>
  </div>

  <a class="hero__scroll" href="#cidade" aria-label="Rolar para A cidade">
    <svg class="ico" aria-hidden="true"><use href="#i-chevron-down"/></svg>
  </a>
</section>
